# YAAM — dedicated virtual host. Other server names are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name yaam.asis.sh;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yaam/acme;
    }
    location / { return 301 https://yaam.asis.sh$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yaam.asis.sh;
    root /var/www/yaam/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yaam.asis.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaam.asis.sh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-CxLtuCsk0EdKadD7Vcj5LUgN0vjlawMJfVjr7IFJKP0='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location ^~ /updates/ {
        alias /var/www/yaam/updates/;
        autoindex off;
    }
    location /releases/ {
        alias /var/www/yaam/releases/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
    }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
}
