name: Xcode - Build and Analyze

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze YAAM
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Build and analyze
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project YAAM.xcodeproj \
                     -scheme YAAM \
                     -configuration Debug \
                     -derivedDataPath build/DerivedData \
                     -resultBundlePath build/CI.xcresult \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build analyze 2>&1 | tee xcodebuild.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-diagnostics
          path: |
            xcodebuild.log
            build/CI.xcresult
          retention-days: 7
